# App
spring.application.name=Job-tracker-AI
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/job_tracker}
spring.datasource.username=${DATABASE_USERNAME:job_tracker_user}
spring.datasource.password=${DATABASE_PASSWORD:user}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent

# Anthropic API (for AI classification)
app.anthropic.api-key=${ANTHROPIC_API_KEY:}

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
